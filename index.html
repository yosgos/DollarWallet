
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <link rel="icon" sizes="192x192" href="Images%20(1).jpeg">
    <link rel="apple-touch-icon" href="Images%20(1).jpeg">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Wallet | US Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap');
        
        :root {
            /* US Colors: Navy Blue, Flag Red, Slate White */
            --bit-cyan: #1e3a8a; 
            --bit-bg: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 50%, #f8fafc 100%);
            --bit-card-bg: rgba(255, 255, 255, 0.85);
            --bit-text-main: #0f172a;
            --bit-text-muted: #475569;
            --color-income-bg: #eff6ff; /* Light Blue */
            --color-income-text: #1e3a8a; /* Navy */
            --color-expense-bg: #fef2f2; /* Light Red */
            --color-expense-text: #b91c1c; /* Dark Red */
            --color-success: #1e40af;
            --color-danger: #b91c1c;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background: var(--bit-bg);
            color: var(--bit-text-main);
            min-height: 100vh;
            padding-bottom: 140px; 
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .bit-card {
            background: var(--bit-card-bg);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            transition: all 0.4s ease;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .action-card-income { background: var(--color-income-bg) !important; color: var(--color-income-text) !important; border-color: #dbeafe !important; backdrop-filter: none; }
        .action-card-expense { background: var(--color-expense-bg) !important; color: var(--color-expense-text) !important; border-color: #fee2e2 !important; backdrop-filter: none; }

        .pocket-chip {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 140px; 
            padding: 1rem;
            border: none;
            color: white;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .pocket-chip.inactive { opacity: 0.6; transform: scale(0.95); filter: grayscale(0.2); }
        .pocket-chip.active { transform: translateY(-6px); box-shadow: 0 15px 20px -5px rgba(0, 0, 0, 0.15); z-index: 10; }

        .btn-bit { background-color: #1e3a8a; color: white; transition: all 0.2s; }
        .nav-item { color: var(--bit-text-muted); transition: all 0.2s ease; }
        .nav-item.active { color: #1e3a8a; }

        .view-content { display: none; }
        .view-content.active { display: block; animation: fadeIn 0.3s ease-out; }

        input, select {
            background: rgba(255, 255, 255, 0.5) !important;
            border: 1px solid rgba(0, 0, 0, 0.08) !important;
            color: var(--bit-text-main) !important;
        }

        .swipe-container {
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            touch-action: pan-y;
            background: transparent;
            margin-bottom: 1rem;
        }
        
        .swipe-action-indicator {
            position: absolute;
            top: 0; bottom: 0; width: 100%;
            display: flex; align-items: center;
            padding: 0 25px;
            font-weight: 800;
            color: white;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .swipe-content {
            position: relative;
            z-index: 1;
            transition: transform 0.1s ease-out;
            background: var(--bit-card-bg);
            backdrop-filter: blur(12px);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-overlay {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight" style="color: #1e3a8a;">SmartWallet</h1>
                <p class="text-slate-600 text-sm font-medium">Smart & Stylish Finance Manager</p>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleSettings()" class="w-12 h-12 bit-card flex items-center justify-center hover:bg-slate-100/50 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main View -->
        <div id="viewActions" class="view-content active">
            <div id="actionCard" class="bit-card p-6 shadow-xl action-card-income">
                <div class="flex bg-black/5 p-1 rounded-2xl mb-8">
                    <button id="typeIncome" onclick="setType('income')" class="flex-1 py-3 rounded-xl bg-[#1e3a8a] text-white font-bold shadow-sm transition-all">Income</button>
                    <button id="typeExpense" onclick="setType('expense')" class="flex-1 py-3 rounded-xl text-slate-600 font-bold transition-all">Expense</button>
                </div>

                <div class="space-y-6">
                    <div>
                        <label class="text-xs font-bold mb-2 block">Target Pocket</label>
                        <select id="pocketSelect" class="w-full p-4 rounded-2xl font-bold outline-none"></select>
                    </div>

                    <div>
                        <label class="text-xs font-bold mb-2 block text-left">Amount</label>
                        <div class="relative">
                            <input type="number" id="amount" class="w-full p-4 rounded-2xl text-3xl font-black text-left outline-none" placeholder="0.00">
                            <span class="absolute right-5 top-1/2 -translate-y-1/2 font-bold opacity-40 text-2xl">$</span>
                        </div>
                    </div>

                    <div>
                        <label class="text-xs font-bold mb-2 block">Description (Optional)</label>
                        <input type="text" id="description" class="w-full p-4 rounded-2xl font-medium outline-none" placeholder="What's this for?">
                    </div>

                    <button id="saveBtn" onclick="saveTransaction()" class="w-full btn-bit font-black py-5 rounded-2xl flex items-center justify-center gap-3 active:scale-95 transition-all shadow-md">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
                        <span>Update Wallet</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- History View -->
        <div id="viewHistory" class="view-content">
            <div class="mb-8">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-slate-700">Your Pockets</h3>
                    <button id="clearFilter" onclick="filterByPocket(null)" class="hidden text-xs font-bold px-3 py-1 rounded-full bg-slate-200 text-slate-700">Show All</button>
                </div>
                <div id="pocketsContainer" class="flex gap-4 overflow-x-auto pb-4 pt-2 no-scrollbar"></div>
            </div>

            <h3 id="historyTitle" class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 px-1">All Transactions</h3>
            <div id="historyList" class="space-y-1"></div>
            <div class="h-24"></div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 border-t border-slate-100/50 px-10 py-5 flex justify-around items-center z-40 bg-white/80 backdrop-blur-xl shadow-lg">
        <button onclick="switchView('actions')" id="navActions" class="nav-item active flex flex-col items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
            <span class="text-[10px] font-bold">New</span>
        </button>
        <button onclick="switchView('history')" id="navHistory" class="nav-item flex flex-col items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2" /></svg>
            <span class="text-[10px] font-bold">History</span>
        </button>
    </nav>

    <!-- Modals -->
    <div id="settingsModal" class="fixed inset-0 modal-overlay hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bit-card w-full max-w-sm rounded-t-[40px] sm:rounded-[40px] p-8 animate__animated animate__slideInUp bg-white/95">
            <h3 class="text-xl font-extrabold mb-6 text-slate-900">Pocket Settings</h3>
            <div class="space-y-6">
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-3 uppercase">Add New Pocket</label>
                    <div class="flex items-center gap-3">
                        <input type="color" id="newPocketColor" value="#1e3a8a" class="cursor-pointer h-12 w-12 rounded-xl border-none p-0 bg-transparent">
                        <input type="text" id="newPocketName" class="flex-1 p-4 rounded-2xl font-bold text-left outline-none" placeholder="Pocket Name">
                        <button onclick="addPocket()" class="btn-bit w-12 h-12 rounded-2xl font-bold flex items-center justify-center shadow-md">+</button>
                    </div>
                </div>
                <label class="text-xs font-bold text-slate-500 block -mb-3 uppercase">Manage Pockets</label>
                <div id="pocketsManagerList" class="max-h-60 overflow-y-auto space-y-3 no-scrollbar"></div>
            </div>
            <button onclick="toggleSettings()" class="w-full mt-8 py-4 text-slate-500 font-bold bg-slate-100/50 rounded-2xl">Close</button>
        </div>
    </div>

    <div id="editModal" class="fixed inset-0 modal-overlay hidden z-[60] flex items-center justify-center p-6">
        <div class="bit-card w-full max-w-sm p-8 animate__animated animate__zoomIn bg-white">
            <h3 class="text-xl font-extrabold mb-6 text-slate-900">Edit Transaction</h3>
            <div class="space-y-5">
                <input type="hidden" id="editTxId">
                <div class="flex bg-slate-100 p-1 rounded-2xl">
                    <button id="editTypeIncome" onclick="setEditType('income')" class="flex-1 py-2 rounded-xl font-bold transition-all">Income</button>
                    <button id="editTypeExpense" onclick="setEditType('expense')" class="flex-1 py-2 rounded-xl font-bold transition-all">Expense</button>
                </div>
                <div><label class="text-[10px] font-bold text-slate-400 block mb-1 uppercase">Target Pocket</label><select id="editPocketSelect" class="w-full p-4 rounded-2xl font-bold outline-none text-sm"></select></div>
                <div><label class="text-[10px] font-bold text-slate-400 block mb-1 uppercase text-left">Amount</label><input type="number" id="editAmount" class="w-full p-4 rounded-2xl text-2xl font-black text-left outline-none"></div>
                <div><label class="text-[10px] font-bold text-slate-400 block mb-1 uppercase">Description</label><input type="text" id="editDescription" class="w-full p-4 rounded-2xl font-medium outline-none text-sm"></div>
            </div>
            <div class="flex gap-3 mt-8">
                <button onclick="closeEdit()" class="flex-1 py-4 bg-slate-100 text-slate-500 font-bold rounded-2xl">Cancel</button>
                <button onclick="saveEdit()" class="flex-1 py-4 bg-slate-900 text-white font-bold rounded-2xl">Save</button>
            </div>
        </div>
    </div>

    <div id="confirmModal" class="fixed inset-0 modal-overlay hidden z-[60] flex items-center justify-center p-6">
        <div class="bit-card w-full max-w-xs p-8 animate__animated animate__zoomIn bg-white">
            <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-6"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></div>
            <h3 id="confirmTitle" class="text-xl font-bold text-center mb-2">Delete?</h3>
            <p id="confirmText" class="text-slate-500 text-center text-sm mb-8"></p>
            <div id="confirmActions" class="flex gap-3"></div>
        </div>
    </div>

    <script>
        const WALLET_ID = 'Wallet_US_1'; 
        const TX_KEY = `bit_tx_${WALLET_ID}`;
        const POCKETS_KEY = `bit_pockets_${WALLET_ID}`;

        let transactions = JSON.parse(localStorage.getItem(TX_KEY)) || [];
        let pockets = JSON.parse(localStorage.getItem(POCKETS_KEY)) || [
            { id: 'p1', name: 'Checking', balance: 0, color: '#1e3a8a' },
            { id: 'p2', name: 'Savings', balance: 0, color: '#b91c1c' },
            { id: 'p3', name: 'Cash', balance: 0, color: '#475569' }
        ];
        
        let currentType = 'income';
        let editCurrentType = 'income';
        let selectedFilter = null;
        let deleteIdPending = null;

        window.onload = () => {
            renderPockets();
            updateUI();
        };

        function saveData() {
            localStorage.setItem(TX_KEY, JSON.stringify(transactions));
            localStorage.setItem(POCKETS_KEY, JSON.stringify(pockets));
        }

        function switchView(view) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if (view === 'actions') {
                document.getElementById('viewActions').classList.add('active');
                document.getElementById('navActions').classList.add('active');
            } else {
                document.getElementById('viewHistory').classList.add('active');
                document.getElementById('navHistory').classList.add('active');
                updateUI();
            }
            window.scrollTo(0,0);
        }

        function setType(type) {
            currentType = type;
            const card = document.getElementById('actionCard');
            const incBtn = document.getElementById('typeIncome');
            const expBtn = document.getElementById('typeExpense');
            if (type === 'income') {
                card.className = "bit-card p-6 shadow-xl action-card-income";
                incBtn.className = "flex-1 py-3 rounded-xl bg-[#1e3a8a] text-white font-bold shadow-sm transition-all";
                expBtn.className = "flex-1 py-3 rounded-xl text-slate-600 font-bold transition-all";
            } else {
                card.className = "bit-card p-6 shadow-xl action-card-expense";
                expBtn.className = "flex-1 py-3 rounded-xl bg-[#b91c1c] text-white font-bold shadow-sm transition-all";
                incBtn.className = "flex-1 py-3 rounded-xl text-slate-600 font-bold transition-all";
            }
        }

        function setEditType(type) {
            editCurrentType = type;
            const incBtn = document.getElementById('editTypeIncome');
            const expBtn = document.getElementById('editTypeExpense');
            if (type === 'income') {
                incBtn.className = "flex-1 py-2 rounded-xl bg-[#1e3a8a] text-white font-bold transition-all shadow-sm";
                expBtn.className = "flex-1 py-2 rounded-xl text-slate-500 font-bold transition-all";
            } else {
                expBtn.className = "flex-1 py-2 rounded-xl bg-[#b91c1c] text-white font-bold transition-all shadow-sm";
                incBtn.className = "flex-1 py-2 rounded-xl text-slate-500 font-bold transition-all";
            }
        }

        function toggleSettings() { document.getElementById('settingsModal').classList.toggle('hidden'); }

        function addPocket() {
            const name = document.getElementById('newPocketName').value.trim();
            const color = document.getElementById('newPocketColor').value;
            if (!name) return;
            pockets.push({ id: 'p' + Date.now(), name, balance: 0, color });
            document.getElementById('newPocketName').value = '';
            saveData();
            renderPockets();
        }

        function renderPockets() {
            const container = document.getElementById('pocketsContainer');
            const select = document.getElementById('pocketSelect');
            const editSelect = document.getElementById('editPocketSelect');
            const manager = document.getElementById('pocketsManagerList');
            
            let html = '';
            let options = '';
            let mgmt = '';
            
            pockets.forEach(p => {
                const bal = transactions.filter(t => t.pocketId === p.id)
                    .reduce((acc, t) => t.type === 'income' ? acc + t.amount : acc - t.amount, 0);
                
                html += `
                    <div onclick="filterByPocket('${p.id}')" class="pocket-chip ${selectedFilter === p.id ? 'active' : 'inactive'}" style="background: ${p.color}">
                        <span class="text-[10px] opacity-80 font-bold uppercase mb-1">${p.name}</span>
                        <span class="text-xl font-black">$${bal.toLocaleString()}</span>
                    </div>
                `;
                options += `<option value="${p.id}">${p.name}</option>`;
                mgmt += `
                    <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl">
                        <div class="flex items-center gap-3">
                            <div class="w-4 h-4 rounded-full" style="background:${p.color}"></div>
                            <span class="font-bold">${p.name}</span>
                        </div>
                        <button onclick="askDeletePocket('${p.id}')" class="text-rose-500 p-2"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg></button>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            select.innerHTML = options;
            editSelect.innerHTML = options;
            manager.innerHTML = mgmt;
        }

        function updateUI() {
            const list = document.getElementById('historyList');
            const title = document.getElementById('historyTitle');
            const clearBtn = document.getElementById('clearFilter');
            
            let filtered = transactions;
            if (selectedFilter) {
                filtered = transactions.filter(t => t.pocketId === selectedFilter);
                title.innerText = `Transactions in: ${pockets.find(p => p.id === selectedFilter).name}`;
                clearBtn.classList.remove('hidden');
            } else {
                title.innerText = "All Transactions";
                clearBtn.classList.add('hidden');
            }

            list.innerHTML = filtered.sort((a,b) => b.date - a.date).map(t => {
                const p = pockets.find(p => p.id === t.pocketId) || {name: 'Deleted', color: '#ccc'};
                return `
                    <div class="swipe-container" id="tx-${t.id}">
                        <div class="swipe-action-indicator bg-rose-500 justify-end" id="ind-del-${t.id}">Delete</div>
                        <div class="swipe-action-indicator bg-amber-500 justify-start" id="ind-edit-${t.id}">Edit</div>
                        <div class="swipe-content bit-card p-5 flex items-center justify-between" 
                             ontouchstart="handleTouchStart(event, '${t.id}')" 
                             ontouchmove="handleTouchMove(event, '${t.id}')" 
                             ontouchend="handleTouchEnd(event, '${t.id}')">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl" style="background: ${p.color}20; color: ${p.color}">
                                    ${t.type === 'income' ? '↓' : '↑'}
                                </div>
                                <div>
                                    <div class="font-extrabold text-slate-800">${t.description || (t.type === 'income' ? 'Income' : 'Expense')}</div>
                                    <div class="text-[10px] font-bold text-slate-400 uppercase">${p.name} • ${new Date(t.date).toLocaleDateString('en-US')}</div>
                                </div>
                            </div>
                            <div class="text-lg font-black ${t.type === 'income' ? 'text-blue-700' : 'text-red-600'}">
                                ${t.type === 'income' ? '+' : '-'}$${t.amount.toLocaleString()}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            renderPockets();
        }

        function filterByPocket(id) {
            selectedFilter = (selectedFilter === id) ? null : id;
            updateUI();
        }

        function saveTransaction() {
            const amount = parseFloat(document.getElementById('amount').value);
            const description = document.getElementById('description').value;
            const pocketId = document.getElementById('pocketSelect').value;
            if (!amount || amount <= 0) return;

            transactions.push({ id: Date.now(), type: currentType, amount, description, pocketId, date: Date.now() });
            saveData();
            document.getElementById('amount').value = '';
            document.getElementById('description').value = '';
            
            const btn = document.getElementById('saveBtn');
            const originalContent = btn.innerHTML;
            btn.innerHTML = 'Saved successfully!';
            btn.style.backgroundColor = '#10b981';
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.style.backgroundColor = '';
                switchView('history');
            }, 800);
        }

        // Swipe Logic
        let touchStartX = 0;
        let currentSwipeId = null;
        let translateX = 0;

        function handleTouchStart(e, id) {
            touchStartX = e.touches[0].clientX;
            currentSwipeId = id;
            translateX = 0;
        }

        function handleTouchMove(e, id) {
            const x = e.touches[0].clientX;
            translateX = x - touchStartX;
            if (Math.abs(translateX) > 100) translateX = translateX > 0 ? 100 : -100;
            
            const content = document.querySelector(`#tx-${id} .swipe-content`);
            const indDel = document.getElementById(`ind-del-${id}`);
            const indEdit = document.getElementById(`ind-edit-${id}`);
            
            content.style.transform = `translateX(${translateX}px)`;
            indDel.style.opacity = translateX < -30 ? 1 : 0;
            indEdit.style.opacity = translateX > 30 ? 1 : 0;
        }

        function handleTouchEnd(e, id) {
            const content = document.querySelector(`#tx-${id} .swipe-content`);
            content.style.transform = `translateX(0)`;
            
            if (translateX < -70) askDeleteTx(id);
            if (translateX > 70) openEdit(id);
            translateX = 0;
        }

        function askDeleteTx(id) {
            deleteIdPending = id;
            document.getElementById('confirmTitle').innerText = "Delete Transaction?";
            document.getElementById('confirmText').innerText = "This will be permanently removed from your history.";
            document.getElementById('confirmModal').classList.remove('hidden');
            document.getElementById('confirmActions').innerHTML = `
                <button onclick="closeConfirm()" class="flex-1 py-4 bg-slate-100 text-slate-600 font-bold rounded-2xl">Cancel</button>
                <button onclick="confirmDeleteTx()" class="flex-1 py-4 bg-[#b91c1c] text-white font-bold rounded-2xl">Delete</button>
            `;
        }

        function confirmDeleteTx() {
            transactions = transactions.filter(t => t.id != deleteIdPending);
            saveData();
            updateUI();
            closeConfirm();
        }

        function openEdit(id) {
            const tx = transactions.find(t => t.id == id);
            if (!tx) return;
            document.getElementById('editTxId').value = id;
            document.getElementById('editAmount').value = tx.amount;
            document.getElementById('editDescription').value = tx.description;
            document.getElementById('editPocketSelect').value = tx.pocketId;
            setEditType(tx.type);
            document.getElementById('editModal').classList.remove('hidden');
        }

        function saveEdit() {
            const id = document.getElementById('editTxId').value;
            const txIndex = transactions.findIndex(t => t.id == id);
            if (txIndex !== -1) {
                transactions[txIndex].amount = parseFloat(document.getElementById('editAmount').value);
                transactions[txIndex].description = document.getElementById('editDescription').value;
                transactions[txIndex].pocketId = document.getElementById('editPocketSelect').value;
                transactions[txIndex].type = editCurrentType;
                saveData();
                updateUI();
            }
            closeEdit();
        }

        function closeEdit() { document.getElementById('editModal').classList.add('hidden'); }
        function closeConfirm() { document.getElementById('confirmModal').classList.add('hidden'); }

        function askDeletePocket(id) {
            if (pockets.length <= 1) return;
            const pocket = pockets.find(p => p.id === id);
            if (!pocket) return;
            deleteIdPending = id;
            document.getElementById('confirmTitle').innerText = "Delete Pocket?";
            document.getElementById('confirmText').innerText = `Are you sure you want to delete "${pocket.name}"?`;
            document.getElementById('confirmModal').classList.remove('hidden');
            document.getElementById('confirmActions').innerHTML = `
                <button onclick="closeConfirm()" class="flex-1 py-4 bg-slate-100 text-slate-600 font-bold rounded-2xl">Cancel</button>
                <button onclick="askHistoryCleanup('${id}')" class="flex-1 py-4 bg-[#b91c1c] text-white font-bold rounded-2xl">Delete</button>
            `;
        }

        function askHistoryCleanup(id) {
            const txCount = transactions.filter(t => t.pocketId === id).length;
            if (txCount === 0) { confirmDeletePocket(id, false); return; }
            document.getElementById('confirmTitle').innerText = "Clean History?";
            document.getElementById('confirmText').innerText = `Found ${txCount} transactions. Should we delete them too?`;
            document.getElementById('confirmActions').innerHTML = `
                <button onclick="confirmDeletePocket('${id}', false)" class="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded-2xl text-xs">Pocket Only</button>
                <button onclick="confirmDeletePocket('${id}', true)" class="flex-1 py-3 bg-[#b91c1c] text-white font-bold rounded-2xl text-xs">Delete All</button>
            `;
        }

        function confirmDeletePocket(id, deleteHistory) {
            pockets = pockets.filter(p => p.id !== id);
            if (deleteHistory) { transactions = transactions.filter(t => t.pocketId !== id); }
            saveData();
            renderPockets();
            updateUI();
            closeConfirm();
        }
    </script>
</body>
</html>
